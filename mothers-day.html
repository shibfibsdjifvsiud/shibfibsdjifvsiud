<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>母亲节快乐 - 感恩妈妈</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'STSong', 'SimSun', 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* ===== Overlay - Envelope ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(170deg, #fef5f0 0%, #fce4d6 30%, #f8d5c4 60%, #fdf2ec 100%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.6s ease;
}
.overlay.hidden {
  transform: translateX(-110%);
  opacity: 0;
}

.envelope {
  width: 160px;
  height: 120px;
  position: relative;
  margin-bottom: 32px;
}
.envelope-body {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #e8a0b4, #d4788f);
  border-radius: 8px;
  clip-path: polygon(0 15%, 50% 55%, 100% 15%, 100% 100%, 0 100%);
}
.envelope-flap {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(135deg, #f0b8c8, #e090a4);
  border-radius: 8px 8px 0 0;
  clip-path: polygon(0 0, 50% 85%, 100% 0);
  transform-origin: top center;
  animation: flapWave 2s ease-in-out infinite;
}
@keyframes flapWave {
  0%, 100% { transform: rotateX(0); }
  50% { transform: rotateX(15deg); }
}
.envelope-heart {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  z-index: 2;
  animation: heartBeat 1.2s ease-in-out infinite;
}
@keyframes heartBeat {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  15% { transform: translate(-50%, -50%) scale(1.15); }
  30% { transform: translate(-50%, -50%) scale(1); }
  45% { transform: translate(-50%, -50%) scale(1.15); }
  60% { transform: translate(-50%, -50%) scale(1); }
}

.overlay-title {
  font-size: 22px;
  color: #8b3a4a;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.overlay-subtitle {
  font-size: 14px;
  color: #b56576;
  margin-bottom: 40px;
}
.open-btn {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #ffb3c6, #f07a93);
  border: none;
  cursor: pointer;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 2px;
  line-height: 1.4;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  box-shadow: 0 8px 32px rgba(240, 122, 147, 0.4);
  animation: btnPulse 2.5s ease-in-out infinite;
  z-index: 1;
}
.open-btn::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: rgba(255,179,198,0.3);
  animation: btnRipple 2.5s ease-in-out infinite;
}
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 8px 32px rgba(240,122,147,0.4); transform: scale(1); }
  50% { box-shadow: 0 8px 48px rgba(240,122,147,0.6); transform: scale(1.03); }
}
@keyframes btnRipple {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.3); opacity: 0; }
}

/* ===== Main Scene ===== */
.scene {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: linear-gradient(175deg, #fef4f0 0%, #fde8e0 20%, #fcd5ce 50%, #fce4dc 80%, #fef7f3 100%);
}

/* Abstract background flowers */
.scene::before {
  content: '';
  position: absolute;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,154,162,0.15) 0%, transparent 70%);
  top: -5%;
  left: -10%;
  border-radius: 50%;
}
.scene::after {
  content: '';
  position: absolute;
  width: 250px;
  height: 250px;
  background: radial-gradient(circle, rgba(255,179,171,0.12) 0%, transparent 70%);
  bottom: 10%;
  right: -8%;
  border-radius: 50%;
}

/* Decorative layers */
.layer {
  position: absolute;
  transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  pointer-events: none;
}
.layer .emoji {
  font-size: 60px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
}

/* Layer 1 - large rose, left */
.l1 {
  width: 80px; height: 80px;
  top: 8%; left: -100%;
  display: flex; align-items: center; justify-content: center;
}
.l1.in { left: 8%; }
.l1.up { left: 8%; top: -15%; }

/* Layer 2 - sparkle, right */
.l2 {
  width: 70px; height: 70px;
  top: 15%; right: -100%;
  display: flex; align-items: center; justify-content: center;
}
.l2.in { right: 6%; }
.l2.up { right: 6%; top: -10%; }

/* Layer 3 - small hearts, left */
.l3 {
  width: 70px; height: 70px;
  top: 22%; left: -100%;
  display: flex; align-items: center; justify-content: center;
}
.l3.in { left: 10%; }
.l3.up { left: 10%; top: 5%; }

/* Layer 4 - tulip, left */
.l4 {
  width: 65px; height: 65px;
  top: 30%; left: -100%;
  display: flex; align-items: center; justify-content: center;
}
.l4.in { left: 4%; }
.l4.up { left: 4%; top: 13%; }

/* Layer 5 - blossom, right */
.l5 {
  width: 75px; height: 75px;
  top: 28%; right: -100%;
  display: flex; align-items: center; justify-content: center;
}
.l5.in { right: 4%; }
.l5.up { right: 4%; top: 13%; }

/* Layer 6 - main center flower */
.l6 {
  width: 55%;
  top: 42%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
}
.l6.in {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
.l6.up {
  top: 20%;
}

/* Layer 7 - message card */
.l7 {
  width: 85%;
  max-width: 400px;
  min-height: 180px;
  top: 55%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 24px 28px;
  box-shadow: 0 8px 40px rgba(180,100,120,0.15);
  border: 1px solid rgba(255,200,200,0.4);
  z-index: 10;
  pointer-events: auto;
}
.l7.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.l7-text {
  font-size: 15px;
  line-height: 1.8;
  color: #d6336c;
  text-align: center;
  min-height: 120px;
}
.l7-text .cursor::after {
  content: '|';
  animation: blink 0.8s step-end infinite;
  color: #d6336c;
  font-weight: 300;
}
.l7-text br { display: block; content: ''; margin-top: 4px; }
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Small heart decorations on card */
.card-heart-tl {
  position: absolute;
  top: -12px; left: -12px;
  font-size: 28px;
  animation: floatSmall 3s ease-in-out infinite;
}
.card-heart-br {
  position: absolute;
  bottom: -12px; right: -12px;
  font-size: 24px;
  animation: floatSmall 3s ease-in-out 1.5s infinite;
}
@keyframes floatSmall {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Music button */
.music-btn {
  position: fixed;
  top: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255,180,180,0.5);
  cursor: pointer;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.music-btn:hover { transform: scale(1.08); }
.music-btn.playing {
  animation: musicSpin 3s linear infinite;
  border-color: #f07a93;
}
@keyframes musicSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.music-tip {
  position: fixed;
  top: 72px;
  right: 20px;
  font-size: 11px;
  color: #b56576;
  z-index: 999;
  pointer-events: none;
  opacity: 0.8;
}

/* Falling petals container */
.petals-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}
.petal {
  position: absolute;
  top: -40px;
  animation: petalFall linear infinite;
  opacity: 0.8;
}
@keyframes petalFall {
  0% {
    transform: translateY(-10px) rotate(0deg) scale(1);
    opacity: 0;
  }
  5% {
    opacity: 0.8;
  }
  85% {
    opacity: 0.5;
  }
  100% {
    transform: translateY(110vh) rotate(720deg) scale(0.3);
    opacity: 0;
  }
}

/* Floating footer message */
.footer-msg {
  position: fixed;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: #c08090;
  letter-spacing: 3px;
  z-index: 8;
  text-align: center;
  opacity: 0;
  transition: opacity 1.5s ease 8s;
}
.footer-msg.visible { opacity: 0.8; }

/* Bg decorative circles */
.bg-circle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.bg-circle.c1 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255,182,170,0.2) 0%, transparent 70%);
  top: 35%; left: -60px;
}
.bg-circle.c2 {
  width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(255,154,162,0.15) 0%, transparent 70%);
  bottom: 30%; right: -40px;
}
.bg-circle.c3 {
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(255,200,180,0.18) 0%, transparent 70%);
  top: 55%; left: 25%;
}

/* Mobile responsive */
@media (max-width: 480px) {
  .overlay-title { font-size: 20px; }
  .envelope { width: 130px; height: 100px; }
  .open-btn { width: 85px; height: 85px; font-size: 13px; }
  .l7 { width: 90%; padding: 18px 20px; }
  .l7-text { font-size: 14px; line-height: 1.7; }
}

@media (min-width: 768px) {
  .l7 { max-width: 480px; }
  .l7-text { font-size: 17px; }
  .l1 .emoji { font-size: 80px; }
  .l2 .emoji { font-size: 70px; }
  .l3 .emoji { font-size: 70px; }
  .l4 .emoji { font-size: 65px; }
  .l5 .emoji { font-size: 75px; }
}
</style>
</head>
<body>

<!-- Overlay -->
<div class="overlay" id="overlay">
  <div class="envelope">
    <div class="envelope-body"></div>
    <div class="envelope-flap"></div>
    <div class="envelope-heart">💌</div>
  </div>
  <div class="overlay-title">母亲节快乐</div>
  <div class="overlay-subtitle">💐 您有一份新的祝福</div>
  <button class="open-btn" onclick="openCard()">拆开<br/>看看</button>
</div>

<!-- Main Scene -->
<div class="scene" id="scene">
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>

  <!-- Decorative layers -->
  <div class="layer l1" id="l1"><span class="emoji">🌹</span></div>
  <div class="layer l2" id="l2"><span class="emoji">✨</span></div>
  <div class="layer l3" id="l3"><span class="emoji">💕</span></div>
  <div class="layer l4" id="l4"><span class="emoji">🌷</span></div>
  <div class="layer l5" id="l5"><span class="emoji">🌸</span></div>
  <div class="layer l6" id="l6"><span class="emoji" style="font-size:100px">💐</span></div>

  <!-- Message card -->
  <div class="layer l7" id="l7">
    <span class="card-heart-tl">💗</span>
    <span class="card-heart-br">💗</span>
    <div class="l7-text" id="typedText"></div>
  </div>

  <!-- Falling petals -->
  <div class="petals-container" id="petals"></div>

  <!-- Footer -->
  <div class="footer-msg" id="footerMsg">💖 妈妈，我永远爱你 💖</div>
</div>

<!-- Music Button -->
<button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="音乐">🎵</button>
<div class="music-tip" id="musicTip">点击播放音乐</div>

<script>
const overlay = document.getElementById('overlay');

const message = `To 我最最亲爱的妈妈 💗

你先是你自己
然后才是我的妈妈

我用一辈子和你说再见
你却用一生祈祷我平安

宇宙洪荒 生命浩瀚
但只有你和我
共享过心跳

你是坚韧的大树
也是温柔的阳光

长安宁 岁无忧
祝妈妈母亲节快乐
愿您岁岁平安 万事顺遂 🌹`;

// ===== Web Audio API Music Generator =====
const BGM = {
  ctx: null,
  masterGain: null,
  padNodes: [],
  melodyTimer: null,
  playing: false,

  async start() {
    if (this.playing) return;
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      await this.ctx.resume();
    }

    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.1;
    this.masterGain.connect(this.ctx.destination);

    // Warm pad: two detuned triangle oscillators (fifth apart)
    const padGain = this.ctx.createGain();
    padGain.gain.value = 0.25;
    padGain.connect(this.masterGain);

    [261.63, 392.00].forEach(freq => {
      const osc = this.ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      osc.connect(padGain);
      osc.start();
      this.padNodes.push(osc);
    });

    // Gentle sub-bass
    const subOsc = this.ctx.createOscillator();
    subOsc.type = 'sine';
    subOsc.frequency.value = 130.81;
    const subGain = this.ctx.createGain();
    subGain.gain.value = 0.15;
    subOsc.connect(subGain);
    subGain.connect(this.masterGain);
    subOsc.start();
    this.padNodes.push(subOsc);

    this.playing = true;
    this.playMelody();
  },

  stop() {
    this.playing = false;
    if (this.melodyTimer) clearTimeout(this.melodyTimer);
    this.padNodes.forEach(n => { try { n.stop(); } catch(e){} });
    this.padNodes = [];
    if (this.ctx) {
      this.ctx.close();
      this.ctx = null;
    }
  },

  playNote(freq, startTime, duration, vol = 0.08) {
    if (!this.ctx || !this.playing) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.04);
    gain.gain.setValueAtTime(vol, startTime + duration * 0.7);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  },

  playMelody() {
    if (!this.playing) return;
    // Pentatonic melody: C D E G A C5
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
    // Gentle heartwarming melody pattern (12-note sequence)
    const pattern = [0, 2, 4, 2, 3, 1, 0, 3, 4, 5, 3, 2];
    const baseDuration = 0.55;
    const now = this.ctx.currentTime;

    pattern.forEach((step, i) => {
      const freq = scale[step];
      const start = now + i * baseDuration;
      const dur = baseDuration * 0.85;
      this.playNote(freq, start, dur, 0.07);
    });

    const totalDuration = pattern.length * baseDuration * 1000;
    this.melodyTimer = setTimeout(() => this.playMelody(), totalDuration - 50);
  }
};

let musicPlaying = false;

function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  const tip = document.getElementById('musicTip');
  if (musicPlaying) {
    BGM.stop();
    btn.classList.remove('playing');
    btn.textContent = '🎵';
    tip.textContent = '音乐已暂停';
    musicPlaying = false;
  } else {
    BGM.start().then(() => {
      btn.classList.add('playing');
      btn.textContent = '🎶';
      tip.textContent = '音乐播放中';
      musicPlaying = true;
    }).catch(() => {
      tip.textContent = '点击播放音乐';
    });
  }
}

function openCard() {
  BGM.start().then(() => {
    document.getElementById('musicBtn').classList.add('playing');
    document.getElementById('musicBtn').textContent = '🎶';
    document.getElementById('musicTip').textContent = '音乐播放中';
    musicPlaying = true;
  }).catch(() => {});

  overlay.classList.add('hidden');

  setTimeout(() => document.getElementById('l1').classList.add('in'), 300);
  setTimeout(() => document.getElementById('l2').classList.add('in'), 800);
  setTimeout(() => document.getElementById('l3').classList.add('in'), 1500);
  setTimeout(() => document.getElementById('l4').classList.add('in'), 1800);
  setTimeout(() => document.getElementById('l5').classList.add('in'), 2000);
  setTimeout(() => document.getElementById('l6').classList.add('in'), 2800);

  setTimeout(() => {
    ['l1','l2','l3','l4','l5','l6'].forEach(id => {
      document.getElementById(id).classList.add('up');
    });
  }, 4500);

  setTimeout(() => document.getElementById('l7').classList.add('show'), 4800);
  setTimeout(() => typeWriter(message, 'typedText', 95), 6300);
  setTimeout(startPetals, 3500);
  setTimeout(() => document.getElementById('footerMsg').classList.add('visible'), 10000);
}

function typeWriter(text, elementId, delay) {
  const el = document.getElementById(elementId);
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  function type() {
    if (i >= text.length) return;
    if (text.slice(i, i + 5) === '<br/>') {
      el.innerHTML = el.innerHTML.replace('<span class="cursor"></span>', '') + '<br/><span class="cursor"></span>';
      i += 5;
    } else {
      el.innerHTML = el.innerHTML.replace('<span class="cursor"></span>', '') + text[i] + '<span class="cursor"></span>';
      i++;
    }
    setTimeout(type, delay);
  }
  type();
}

function startPetals() {
  const container = document.getElementById('petals');
  const petalEmojis = ['🌸', '💮', '🌷', '🌺', '💐', '🌼', '🏵️'];

  function createPetal() {
    const petal = document.createElement('span');
    petal.className = 'petal';
    petal.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
    petal.style.left = Math.random() * 100 + '%';
    petal.style.fontSize = (14 + Math.random() * 22) + 'px';
    petal.style.animationDuration = (8 + Math.random() * 14) + 's';
    container.appendChild(petal);
    const duration = parseFloat(petal.style.animationDuration) * 1000;
    setTimeout(() => petal.remove(), duration + 200);
  }

  for (let i = 0; i < 8; i++) {
    setTimeout(() => createPetal(), i * 300);
  }
  setInterval(createPetal, 800 + Math.random() * 400);
}
</script>
</body>
</html>
